# Gym UES - Configuracion de despliegue en Render (Blueprint).
#
# COMO USARLO
#   1. Sube este repositorio a GitHub.
#   2. En Render: New > Blueprint, selecciona el repo. Render lee este archivo.
#   3. En el panel de Render rellena MONGODB_URI y ADMIN_SECRET_KEY
#      (los marca como "secret", no se pueden dejar en el repositorio).
#
# IMPORTANTE ANTES DEL PRIMER DESPLIEGUE
#   En MongoDB Atlas -> Network Access hay que permitir la IP de salida de
#   Render (o 0.0.0.0/0 mientras se prueba). Si no, el servicio arranca pero
#   se queda sin base de datos.
#
# NOTA SOBRE MYSQL
#   Estas variables de MySQL NO hacen falta en Render: la aplicacion ya no usa
#   MySQL, solo se conservaron para poder ejecutar la migracion historica
#   (npm run migrar) contra una base local. No estan aqui a proposito.
services:
  - type: web
    name: gym-ues
    runtime: node
    # Plan gratuito. Ojo: con plan free Render apaga el servicio tras unos
    # minutos sin uso y la siguiente visita tarda unos 30-50 s en "despertar".
    # Si quieres que la app responda siempre al instante, cambia esta linea a
    #   plan: starter
    # (plan de pago; el ajuste se hace aqui y con "Save & Deploy").
    plan: free
    region: oregon
    branch: main
    # Atlas no siempre responde en el primer segundo tras el arranque; se le
    # concede margen antes de marcar el servicio como saludable.
    healthCheckPath: /api/health
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Zona horaria del gimnasio. OJO: el backend ya NO depende de esta
      # variable; server/zona.js fija America/Mexico_City con Intl para que las
      # horas del historial no dependan de donde corra el servidor (Render usa
      # UTC). Se deja declarada igual a proposito: asi cualquier otra parte del
      # proceso que lea la hora con los getters de Date coincide con el gym, y
      # no se abre una segunda fuente de verdad.
      - key: TZ
        value: America/Mexico_City
      - key: MONGODB_URI
        sync: false # pegar aqui la URI de Atlas (mongodb+srv://...)
      - key: ADMIN_SECRET_KEY
        generateValue: true
      # Recuperacion de contrasena por correo (Gmail SMTP). Se rellenan en el
      # panel de Render con la CONTRASENA DE APLICACION de Google (Cuenta >
      # Seguridad > Contrasenas de aplicacion), nunca la contrasena normal.
      # Si se dejan vacios, el login usa solo la clave secreta.
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      # Render ya define PORT; el servidor lo respeta (server/index.js).
      # Pool de conexiones a Atlas. 100 permite sostener cientos de peticiones
      # simultaneas (checador + portal) sin hacer cola; el plan gratuito de
      # Atlas permite hasta 500 conexiones, asi que queda margen.
      - key: MONGO_MAX_POOL
        value: "100"
      - key: MONGO_MIN_POOL
        value: "10"
      - key: MONGO_MAX_CONNECTING
        value: "10"
      # Auto-registros permitidos por IP y hora. 300 cubre una jornada de
      # inscripcion detras del NAT del campus sin dejar el endpoint abierto.
      - key: LIMITE_REGISTRO_IP
        value: "300"
      # Consultas/actualizaciones de datos propios por IP y hora. Se mantiene
      # aparte del auto-registro para que corregir datos no consuma el cupo de
      # altas de una jornada de inscripcion.
      - key: LIMITE_CONSULTA_IP
        value: "240"
      # PUBLIC_URL se rellena solo cuando el servicio ya tiene dominio; si se
      # deja vacio, la API devuelve rutas relativas (/api/archivos/...), que es
      # justo lo que necesita el frontend servido desde el mismo dominio.
      - key: PUBLIC_URL
        sync: false
      - key: AJUSTES_CACHE_MS
        value: "60000"
      - key: CONTEO_CACHE_MS
        value: "5000"
